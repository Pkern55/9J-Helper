name: Build 9J Helper

on:
  push:
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    env:
      CLIENT_JSON: ${{ secrets.GOOGLE_CLIENT_SECRET_JSON }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Run tests
        run: python -m pytest -q

      - name: Add Google OAuth client
        if: ${{ env.CLIENT_JSON != '' }}
        shell: pwsh
        run: Set-Content -Path client_secret.json -Value $env:CLIENT_JSON -Encoding utf8NoBOM

      - name: Build exe
        shell: pwsh
        run: ./build_exe.ps1

      - uses: actions/upload-artifact@v4
        with:
          name: 9J-Helper
          path: dist/9J-Helper.exe

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/9J-Helper.exe
